<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しょうがっこう3ねん りか「花のすがた」クイズ</title>
  <style>
    :root {
      --primary-color: #ff9800;
      --secondary-color: #4caf50;
      --bg-color: #fffde7;
    }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 750px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #e65100;
      font-size: 1.8rem;
      border-bottom: 3px dashed #ffe082;
      padding-bottom: 10px;
      margin-top: 0;
    }
    .quiz-section {
      background: #fafafa;
      border: 2px solid #ffe082;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .quiz-title {
      font-size: 1.25rem;
      color: #2e7d32;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--secondary-color);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    .instruction {
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }
    .img-card {
      aspect-ratio: 1 / 1;
      border: 4px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      padding: 5px;
      box-sizing: border-box;
    }
    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }
    .img-card.selected {
      border-color: #ff9800;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255,152,0,0.5);
    }
    .fill-sentence {
      font-size: 1.15rem;
      line-height: 2.2;
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
    select {
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 2px solid #ff9800;
      background-color: #fff8e1;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-check {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px #e65100;
    }
    .btn-check:active {
      box-shadow: 0 1px #e65100;
      transform: translateY(3px);
    }
    .result-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      min-height: 28px;
    }
    .correct { color: #2e7d32; }
    .incorrect { color: #c62828; }
    .summary-img-box {
      margin-top: 15px;
      text-align: center;
      display: none;
    }
    .summary-img-box img {
      max-width: 100%;
      border-radius: 10px;
      border: 2px solid #ff9800;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 理科「花のすがた」チャレンジクイズ 🌻</h1>

    <!-- 問題 1: ホウセンカ -->
    <div class="quiz-section">
      <h2 class="quiz-title"><span class="badge">問題 1</span> ホウセンカの そだちかた</h2>
      <p class="instruction">カードを2つえらんでいれかえ、成長のじゅんばんに並べよう！<br>（つぼみ → 花 → さいた後）</p>
      <div class="card-grid" id="grid-housenka"></div>
      <button class="btn-check" onclick="checkHousenka()">こたえあわせ</button>
      <div class="result-msg" id="result-housenka"></div>
    </div>

    <!-- 問題 2: ヒマワリ -->
    <div class="quiz-section">
      <h2 class="quiz-title"><span class="badge">問題 2</span> ヒマワリの そだちかた</h2>
      <p class="instruction">カードを2つえらんでいれかえ、成長のじゅんばんに並べよう！<br>（つぼみ → 花 → さいた後）</p>
      <div class="card-grid" id="grid-himawari"></div>
      <button class="btn-check" onclick="checkHimawari()">こたえあわせ</button>
      <div class="result-msg" id="result-himawari"></div>
    </div>

    <!-- 問題 3: まとめ穴埋め -->
    <div class="quiz-section">
      <h2 class="quiz-title"><span class="badge">問題 3</span> まとめを かんせいさせよう</h2>
      <p class="instruction">（ ）にあてはまる ことばを えらぼう！</p>
      <div class="fill-sentence">
        ● <ruby>草<rt>くさ</rt></ruby>たけは 
        <select id="blank1">
          <option value="">--えらんでね--</option>
          <option value="高く">高く</option>
          <option value="ひくく">ひくく</option>
          <option value="みじかく">みじかく</option>
        </select> なり、 
        <select id="blank2">
          <option value="">--えらんでね--</option>
          <option value="葉">葉</option>
          <option value="花">花</option>
          <option value="根">根</option>
        </select> の<ruby>数<rt>かず</rt></ruby>はふえ、<br>
        くきが 
        <select id="blank3">
          <option value="">--えらんでね--</option>
          <option value="太く">太く</option>
          <option value="細く">細く</option>
          <option value="みじかく">みじかく</option>
        </select> なった。やがて、 
        <select id="blank4">
          <option value="">--えらんでね--</option>
          <option value="花">花</option>
          <option value="実">実</option>
          <option value="葉">葉</option>
        </select> がさいた。
      </div>
      <button class="btn-check" onclick="checkSummary()">こたえあわせ</button>
      <div class="result-msg" id="result-summary"></div>
      
      <div class="summary-img-box" id="summary-box">
        <p><strong>【まとめ】</strong></p>
        <img src="summary.png" alt="まとめの画像">
      </div>
    </div>
  </div>

  <script>
    const housenkaData = [
      { id: 1, src: 'housenka-1.png' },
      { id: 2, src: 'housenka-2.png' },
      { id: 3, src: 'housenka-3.png' }
    ];

    const himawariData = [
      { id: 1, src: 'himawari-1.png' },
      { id: 2, src: 'himawari-2.png' },
      { id: 3, src: 'himawari-3.jpg' }
    ];

    let currentHousenka = [];
    let currentHimawari = [];
    let selectedCard = null;

    function init() {
      currentHousenka = shuffle([...housenkaData]);
      currentHimawari = shuffle([...himawariData]);
      renderGrid('grid-housenka', currentHousenka, 'housenka');
      renderGrid('grid-himawari', currentHimawari, 'himawari');
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderGrid(containerId, dataArray, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      dataArray.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.dataset.index = index;
        card.dataset.type = type;
        
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = `${type} image ${index + 1}`;
        card.appendChild(img);

        card.onclick = () => handleCardClick(card, dataArray, containerId, type);
        container.appendChild(card);
      });
    }

    function handleCardClick(cardEl, dataArray, containerId, type) {
      if (!selectedCard) {
        selectedCard = { element: cardEl, index: parseInt(cardEl.dataset.index), type: type };
        cardEl.classList.add('selected');
      } else if (selectedCard.type === type) {
        if (selectedCard.element === cardEl) {
          cardEl.classList.remove('selected');
          selectedCard = null;
        } else {
          const idx1 = selectedCard.index;
          const idx2 = parseInt(cardEl.dataset.index);
          [dataArray[idx1], dataArray[idx2]] = [dataArray[idx2], dataArray[idx1]];
          selectedCard.element.classList.remove('selected');
          selectedCard = null;
          renderGrid(containerId, dataArray, type);
        }
      } else {
        selectedCard.element.classList.remove('selected');
        selectedCard = { element: cardEl, index: parseInt(cardEl.dataset.index), type: type };
        cardEl.classList.add('selected');
      }
    }

    function checkHousenka() {
      const isCorrect = currentHousenka.every((item, idx) => item.id === idx + 1);
      const res = document.getElementById('result-housenka');
      if (isCorrect) {
        res.innerHTML = '🎉 せいかい！ ホウセンカの花のさきかたがバッチリわかるね！';
        res.className = 'result-msg correct';
      } else {
        res.innerHTML = '❌ おしい！ もう一度順番を考えてみよう！';
        res.className = 'result-msg incorrect';
      }
    }

    function checkHimawari() {
      const isCorrect = currentHimawari.every((item, idx) => item.id === idx + 1);
      const res = document.getElementById('result-himawari');
      if (isCorrect) {
        res.innerHTML = '🎉 せいかい！ ヒマワリの花のさきかたもバッチリ！';
        res.className = 'result-msg correct';
      } else {
        res.innerHTML = '❌ おしい！ もう一度順番を考えてみよう！';
        res.className = 'result-msg incorrect';
      }
    }

    function checkSummary() {
      const b1 = document.getElementById('blank1').value;
      const b2 = document.getElementById('blank2').value;
      const b3 = document.getElementById('blank3').value;
      const b4 = document.getElementById('blank4').value;
      const res = document.getElementById('result-summary');
      const box = document.getElementById('summary-box');

      if (b1 === '高く' && b2 === '葉' && b3 === '太く' && b4 === '花') {
        res.innerHTML = '🎉 大せいかい！ まとめをばっちり覚えることができたね！';
        res.className = 'result-msg correct';
        box.style.display = 'block';
      } else {
        res.innerHTML = '❌ おしい！ 観察したことを思いだしてもう一度えらんでみよう！';
        res.className = 'result-msg incorrect';
        box.style.display = 'none';
      }
    }

    window.onload = init;
  </script>
</body>
</html>
